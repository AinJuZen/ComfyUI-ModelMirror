[project]
name = "comfyui-modelmirror"
version = "0.2.6"
description = "ComfyUI 缺模型时一键从镜像补齐：自动识别缺失、按文件名反查官方仓库、断点续传。不改官方文件，升级不碎。"
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.urls]
Repository = "https://github.com/AinJuZen/ComfyUI-ModelMirror"
Issues = "https://github.com/AinJuZen/ComfyUI-ModelMirror/issues"

[tool.comfy]
PublisherId = "ainjuzen"
DisplayName = "ComfyUI-ModelMirror"
Icon = "https://raw.githubusercontent.com/AinJuZen/ComfyUI-ModelMirror/main/docs/icon.png"
requires-comfyui = ">=0.3.0"
